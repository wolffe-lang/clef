# Local PR evidence is cheap unless ci/full-matrix opts in.
# Existing nightly commands and publication jobs are preserved.
name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [trunk]
    paths:
      - '.github/**'
      - 'ci/**'
      - '!ci/*.md'
      - '!ci/**/*.md'
      - 'tools/**'
      - 'spec/**'
      - '**/wolf-toolchain.toml'
      - '**/rust-toolchain.toml'
      - '**/*.pin'
      - '**/PAIRING'
      - '**/STD-PIN'
      - 'vendor/tools.toml'
      - 'gnu-oracle.toml'
      - '.gitmodules'
      - 'Cargo.toml'
      - 'Cargo.lock'
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Job ids, space separated; empty runs every job'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}-{1}', github.head_ref, (github.event.action == 'labeled' && github.event.label.name != 'full-matrix') && format('noop-{0}', github.run_id) || (contains(github.event.pull_request.labels.*.name, 'full-matrix') && 'full' || 'pr')) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-matrix') || contains(github.event.pull_request.labels.*.name, 'ci') || contains(github.event.pull_request.labels.*.name, 'release-matrix') }}
        with:
          fetch-depth: 2
      - id: plan
        if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-matrix') || contains(github.event.pull_request.labels.*.name, 'ci') || contains(github.event.pull_request.labels.*.name, 'release-matrix') }}
        env:
          EVENT: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'release-matrix') && 'push' || github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IN_JOBS: ${{ inputs.jobs }}
        run: python3 ci/tiers.py plan --merge --github-output "$GITHUB_OUTPUT"
      - name: local gate wiring proof
        if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-matrix') || contains(github.event.pull_request.labels.*.name, 'ci') || contains(github.event.pull_request.labels.*.name, 'release-matrix') }}
        run: python3 -I ci/local-gate-test.py
      - name: local evidence gate
        if: ${{ !(github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-matrix') || contains(github.event.pull_request.labels.*.name, 'ci') || contains(github.event.pull_request.labels.*.name, 'release-matrix')) }}
        run: echo 'Local gauntlet evidence is the gate; request ci or full-matrix for CI.'
  plan-test:
    needs: plan
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-matrix') || contains(github.event.pull_request.labels.*.name, 'ci') || contains(github.event.pull_request.labels.*.name, 'release-matrix')) && (contains(fromJSON(needs.plan.outputs.jobs || '[]'), 'plan-test')) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 ci/tiers-test.py
  linux:
    name: linux x86-64 (every gate)
    needs: plan
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-matrix') || contains(github.event.pull_request.labels.*.name, 'ci') || contains(github.event.pull_request.labels.*.name, 'release-matrix')) && (contains(fromJSON(needs.plan.outputs.jobs || '[]'), 'linux')) }}
    runs-on: ubuntu-24.04
    # 60, not 20: a toolchain pin misses the cache (its key hashes
    # wolf-toolchain.toml), and the cold build downloads the 120 pinned
    # packages one by one; twice that alone outlasted 20 minutes (clef#14).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            .wolf-bin
            target/container
          key: clef-linux-${{ hashFiles('wolf-toolchain.toml', 'ci/oracle-lock.json') }}
      - name: census, oracle, proof, writer, and refusal gates
        env:
          CLEF_ENGINE: docker
        run: tools/in-container tools/gate
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: linux-evidence
          path: target/evidence
  corpus:
    name: exhaustive census second-opinion corpus
    needs: plan
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-matrix') || contains(github.event.pull_request.labels.*.name, 'ci') || contains(github.event.pull_request.labels.*.name, 'release-matrix')) && (contains(fromJSON(needs.plan.outputs.jobs || '[]'), 'corpus')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: target/container
          key: clef-oracle-${{ hashFiles('ci/oracle-lock.json') }}
      - env:
          CLEF_ENGINE: docker
        run: tools/in-container tools/corpus --check
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: corpus-evidence
          path: target/corpus
  tier:
    name: tier ${{ needs.plan.outputs.tier || 'unplanned' }}
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-matrix') || contains(github.event.pull_request.labels.*.name, 'ci') || contains(github.event.pull_request.labels.*.name, 'release-matrix')) && (!cancelled()) }}
    needs:
      - plan
      - plan-test
      - linux
      - corpus
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 ci/tiers.py verdict

  nightly-red:
    name: nightly red, an issue
    needs: tier
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ci/nightly-red.sh
